# Revisa cada semana si hay versiones nuevas de las dependencias y de las
# acciones de GitHub, y abre un pull request con la actualización.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
