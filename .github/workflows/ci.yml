# Revisa cada cambio que llega a main (o a un pull request): lint, tipos,
# pruebas con cobertura mínima, build y dependencias vulnerables.
# No publica nada: la publicación sigue siendo "npm run deploy".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
