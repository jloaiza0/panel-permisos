<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F4EF" />
    <title>Panel de ausentismo</title>
    <!-- Aplica el tema ANTES de que cargue la app (evita un parpadeo blanco):
         el que el usuario eligió con el botón sol/luna o, la primera vez,
         el modo de su sistema operativo. -->
    <script>
      try {
        var tema = localStorage.getItem("panel-tema");
        if (tema === "dark" || (!tema && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#14171B");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
